info:
  name: login
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8085/realms/hotel-booking-system/protocol/openid-connect/token
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: frontend-client
      - name: grant_type
        value: password
      - name: username
        value: user1@gmail.com
      - name: password
        value: Password123
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("access_token", res.body.access_token);
        console.log("access_token: ", bru.getVar("access_token"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

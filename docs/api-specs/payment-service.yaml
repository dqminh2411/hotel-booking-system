openapi: 3.0.3
info:
  title: Payment Service API
  description: >
    Tài liệu đặc tả API REST của Payment Service. Service này chủ yếu xử lý
    nghiệp vụ thanh toán (process payment, refund) thông qua Kafka
    (consume topic `payment-commands`, publish topic `payment-events`),
    không phải qua REST endpoint. Tài liệu này chỉ mô tả endpoint HTTP
    thực tế được expose bởi service.
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:5000
    description: Local / default port (server.port, mặc định 5000)

tags:
  - name: Health
    description: Endpoint kiểm tra trạng thái hoạt động của service

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: >
        Trả về trạng thái hoạt động hiện tại của Payment Service.
        Dùng cho mục đích kiểm tra liveness (ví dụ: load balancer,
        container orchestrator, hoặc service discovery).
      operationId: getHealth
      responses:
        "200":
          description: Service đang hoạt động bình thường.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

components:
  schemas:
    HealthResponse:
      type: object
      description: Kết quả kiểm tra trạng thái hoạt động của service.
      properties:
        status:
          type: string
          description: Trạng thái hiện tại của service.
          example: ok
      required:
        - status

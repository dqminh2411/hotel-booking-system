# docker-compose.test-hotel-service.yml
# Mục đích: test riêng hotel-service + MinIO (tạo hotel, upload/xoá ảnh),
# KHÔNG khởi động toàn bộ hệ thống microservices.
#
# Đã bỏ so với docker-compose.yml gốc:
#   - frontend, gateway                -> không cần thiết, test thẳng vào hotel-service qua Postman
#   - eureka-server                    -> tắt qua EUREKA_ENABLED=false, hotel-service tự chạy độc lập
#   - zookeeper                        -> dùng Kafka chế độ KRaft (single-node), không cần zookeeper nữa
#   - user-service, booking-service, place-booking-service, payment-service,
#     promotion-service, notification-service (và toàn bộ DB riêng của chúng)
#                                       -> không liên quan tới 3 API đang test
#
# Giữ lại (bắt buộc để hotel-service chạy được):
#   - hotel-db (Postgres)              -> lưu dữ liệu hotel
#   - redis                            -> hotel-service có dùng @Cacheable, thiếu sẽ lỗi khi gọi các API có cache
#   - minio                            -> lưu ảnh
#   - kafka (KRaft, không zookeeper)   -> publish ReviewHotelCommand
#   - kafka-ui (tuỳ chọn)              -> xem trực quan message đã publish, có thể xoá nếu muốn chạy nhanh hơn nữa
#   - keycloak + keycloak-db           -> bắt buộc để lấy JWT test role HOTEL_OWNER/PLATFORM_ADMIN
#
# Chạy: docker compose -f docker-compose.test-hotel-service.yml up --build

name: hotel-service-test
services:

  hotel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${HOTEL_DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${HOTEL_DB_NAME:-hotel_db}
      POSTGRES_USER: ${HOTEL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:-postgres}
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
      - ./services/hotel-service/hotel_db_init.sql:/docker-entrypoint-initdb.d/hotel_db_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOTEL_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # Kafka chế độ KRaft (single-node, không cần zookeeper) - khởi động nhanh hơn
  # đáng kể so với bản zookeeper + kafka 2 container trong docker-compose gốc.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "hotel-test-cluster-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # Tuỳ chọn - UI để xem trực quan message ReviewHotelCommand đã publish.
  # Muốn chạy nhanh hơn nữa thì xoá hẳn service này, không ảnh hưởng hotel-service.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - app-network

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-db}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-1}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-db} -d ${KEYCLOAK_DB_NAME:-keycloak_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-db}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-1}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    networks:
      - app-network

  hotel-service:
    build: ./services/hotel-service
    ports:
      - "${HOTEL_SERVICE_PORT:-5003}:5000"
    environment:
      SERVER_PORT: 5000
      DB_HOST: hotel-db
      DB_PORT: 5432
      DB_NAME: ${HOTEL_DB_NAME:-hotel_db}
      DB_USER: ${HOTEL_DB_USER:-postgres}
      DB_PASSWORD: ${HOTEL_DB_PASSWORD:-postgres}

      # Tắt hẳn Eureka - không có eureka-server trong bản test này.
      EUREKA_ENABLED: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_BUCKET_HOTEL_IMAGES: ${MINIO_BUCKET_HOTEL_IMAGES:-hotel-images}

      # QUAN TRỌNG: phải là 29092 (listener PLAINTEXT nội bộ Docker network),
      # KHÔNG dùng 9092 (listener PLAINTEXT_HOST dành cho máy host).
      # Đây chính là lỗi mình phát hiện ở docker-compose.yml gốc.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: hotel-service-group

      KEYCLOAK_ISSUER_URI: http://localhost:8085/realms/hotel-booking-system
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs
    depends_on:
      hotel-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
    volumes:
      - ./services/hotel-service:/app
      - maven-cache:/root/.m2

networks:
  app-network:
    driver: bridge

volumes:
  hotel-db-data:
  minio-data:
  keycloak-db-data:
  maven-cache:

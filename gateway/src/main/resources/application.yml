spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://127.0.0.1:3000"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: place-booking-service-route
              uri: lb://place-booking-service
              predicates:
                - Path=/place-booking,/place-booking/**

            - id: booking-service-route
              uri: lb://booking-service
              predicates:
                - Path=/bookings,/bookings/**

            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users,/api/users/**

            - id: hotel-service-route
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/room-types/**,/api/admin/hotels/**,/api/minio/**

            - id: promotion-service-route
              uri: lb://promotion-service
              predicates:
                - Path=/api/promotions,/api/promotions/**

            - id: notification-service-route
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications,/api/notifications/**
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8085/realms/hotel-booking-system}
server:
  port: ${SERVER_PORT:8000}

keycloak:
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/hotel-booking-system}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

chassis:
  logging:
    enabled: true
    json-enabled: ${CHASSIS_LOGGING_JSON_ENABLED:true}



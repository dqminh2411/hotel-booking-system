spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: place-booking-service-route
          uri: lb://place-booking-service
          predicates:
            - Path=/place-booking,/place-booking/**
        - id: booking-service-route
          uri: lb://booking-service
          predicates:
            - Path=/bookings,/bookings/**
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users, /api/users/**

server:
  port: ${SERVER_PORT:8000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}


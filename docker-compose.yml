  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - app-network
  user-service:
    build: ./services/user-service
    ports:
      - "${USER_SERVICE_PORT:-5002}:5000"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 5000
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost:3000/verify-email}
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      chassis-init:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - ./services/user-service:/app
      - ./chassis:/app/chassis
      - maven-cache:/root/.m2

  hotel-service:
    build: ./services/hotel-service
    ports:
      - "${HOTEL_SERVICE_PORT:-5003}:5000"
    env_file:
      - .env
    environment:
      DB_HOST: ${HOTEL_DB_HOST}
      DB_PORT: ${HOTEL_DB_PORT}
      DB_NAME: ${HOTEL_DB_NAME}
      DB_USER: ${HOTEL_DB_USER}
      DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      SERVER_PORT: 5000
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      MINIO_BUCKET_HOTEL_IMAGES: ${MINIO_BUCKET_HOTEL_IMAGES:-hotel-images}

    depends_on:
      hotel-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      chassis-init:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - ./services/hotel-service:/app
      - ./chassis:/app/chassis
      - maven-cache:/root/.m2

  booking-service:
    build: ./services/booking-service
    ports:
      - "${BOOKING_SERVICE_PORT:-5004}:5000"
      - "5010:5010" # debug
    env_file:
      - .env
    environment:
      DB_HOST: ${BOOKING_DB_HOST}
      DB_PORT: ${BOOKING_DB_PORT}
      DB_NAME: ${BOOKING_DB_NAME}
      DB_USER: ${BOOKING_DB_USER}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      SERVER_PORT: 5000
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-booking-service-group}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-100}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8085/realms/hotel-booking-system}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}
    command:
      - mvn
      - spring-boot:run
      - -Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      chassis-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network
    volumes:
      - ./services/booking-service:/app
      - ./chassis:/app/chassis
      - maven-cache:/root/.m2

  place-booking-service:
    build: ./services/place_booking_service
    ports:
      - "${PLACE_BOOKING_SERVICE_PORT:-5001}:5000"
      - "5011:5011" # debug
    env_file:
      - .env
    environment:
      DB_HOST: ${PLACE_BOOKING_DB_HOST}
      DB_PORT: ${PLACE_BOOKING_DB_PORT}
      DB_NAME: ${PLACE_BOOKING_DB_NAME}
      DB_USER: ${PLACE_BOOKING_DB_USER}
      DB_PASSWORD: ${PLACE_BOOKING_DB_PASSWORD}
      SERVER_PORT: 5000
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_CONSUMER_GROUP: place-booking-group
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command:
      - mvn
      - spring-boot:run
      - -Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5011
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      place-booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
      hotel-service:
        condition: service_started
      booking-service:
        condition: service_started
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      chassis-init:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - ./services/place_booking_service:/app
      - ./chassis:/app/chassis
      - maven-cache:/root/.m2

  payment-service:
    build: ./services/payment_service
    ports:
      - "${PAYMENT_SERVICE_PORT:-5005}:5000"
    env_file:
      - .env
    environment:
      DB_HOST: ${PAYMENT_DB_HOST}
      DB_PORT: ${PAYMENT_DB_PORT}
      DB_NAME: ${PAYMENT_DB_NAME}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      SERVER_PORT: 5000
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      KAFKA_CONSUMER_GROUP: payment-group
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka}
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      chassis-init:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - ./services/payment_service:/app
      - ./chassis:/app/chassis
      - maven-cache:/root/.m2


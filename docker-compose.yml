  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db

    ports:
      - "${KEYCLOAK_DB_EXTERNAL_PORT:-5439}:${KEYCLOAK_DB_PORT:-5432}"
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-db}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-1}

    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-db} -d ${KEYCLOAK_DB_NAME:-keycloak_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: ${KC_DB:-postgres}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST:-keycloak-db}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE:-keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-db}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-your-password}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}

    ports:
      - "8085:8080"
    volumes:
      - ./keycloak/theme/hotelhub:/opt/keycloak/themes/hotelhub
      - ./keycloak/import:/opt/keycloak/data/import
    networks:
      - app-network

  # ── Elasticsearch ──────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # Tắt auth cho dev
      - ES_JAVA_OPTS=-Xms1g -Xmx1g       # Giới hạn RAM
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # ── Kibana ─────────────────────────────────────────────────────────────
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.13.0
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   ports:
  #     - "5601:5601"
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #   networks:
  #     - app-network

   # ── OTel Collector (thay thế Filebeat + Logstash) ─────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otel/otel-collector.yaml"]
    # add env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./infra/otel:/etc/otel:ro
      # Mount Docker socket để đọc container logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "4317:4317"    # OTLP gRPC — service gửi traces/metrics đến đây
      - "4318:4318"    # OTLP HTTP — alternative cho gRPC
      - "8888:8888"    # Collector internal metrics (Prometheus scrape)
      # - "8889:8889"    # Prometheus metrics exporter
    depends_on:
      - elasticsearch
      - jaeger
    networks:
      - app-network

  # ── Jaeger (Distributed Tracing backend) ──────────────────────────────
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true    # Nhận trace qua OTLP protocol
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - ES_INDEX_PREFIX=jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317"   # OTLP gRPC (Jaeger nhận từ Collector)
      - "4318"   # OTLP HTTP
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  user-db-data:
  hotel-db-data:
  booking-db-data:
  notification-db-data:
  promotion-db-data:
  maven-cache:
  redis-data:
  keycloak-db-data:
  minio-data:
  elasticsearch_data:

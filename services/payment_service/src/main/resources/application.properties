spring.application.name=payment-service

# SERVER
server.port=${SERVER_PORT:5000}

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-group}
spring.kafka.consumer.auto-offset-reset=earliest

# deserialize JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# serialize JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ======================
# RESILIENCE4J CIRCUIT BREAKER
# ======================
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.sliding-window-size=2
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=1

resilience4j.circuitbreaker.instances.paymentGateway.base-config=default

# Outbox publisher
outbox.publisher.delay=100

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:postgresql://${DB_HOST:payment-db}:${DB_PORT:5432}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# EUREKA
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}

# Chassis Logging Configuration
chassis.logging.enabled=true
chassis.logging.json-enabled=${CHASSIS_LOGGING_JSON_ENABLED:true}
chassis.logging.aspect-enabled=true
chassis.logging.slow-request-threshold-ms=1000
chassis.logging.exclude-paths[0]=/actuator/health
chassis.logging.exclude-paths[1]=/actuator/info
chassis.logging.exclude-paths[2]=/actuator/prometheus




logging.level.root=INFO
logging.level.com.hotelbooking=DEBUG




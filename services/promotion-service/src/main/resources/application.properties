spring.application.name=promotion-service

# SERVER
server.port=${SERVER_PORT:5000}

# DATABASE (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:promotion-db}:${DB_PORT:5432}/${DB_NAME:promotion_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:promotion-group}
spring.kafka.consumer.auto-offset-reset=earliest

# deserialize JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# serialize JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# EUREKA
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# REDIS
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# KEYCLOAK (OAuth2 Resource Server)
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/hotel-booking-system}
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}

outbox.publisher.delay=100

# Chassis Logging Configuration
chassis.logging.enabled=true
chassis.logging.json-enabled=${CHASSIS_LOGGING_JSON_ENABLED:true}
chassis.logging.aspect-enabled=true
chassis.logging.slow-request-threshold-ms=1000
chassis.logging.exclude-paths[0]=/actuator/health
chassis.logging.exclude-paths[1]=/actuator/info
chassis.logging.exclude-paths[2]=/actuator/prometheus

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
otel.propagators=tracecontext,baggage

logging.level.root=INFO
logging.level.com.hotelbooking=DEBUG


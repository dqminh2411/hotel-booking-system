spring.application.name=user-service
server.port=${SERVER_PORT:5000}

spring.datasource.url=jdbc:postgresql://${DB_HOST:user-db}:${DB_PORT:5432}/${DB_NAME:user_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:30d}
app.auth.verification-token-ttl=${VERIFICATION_TOKEN_TTL:24h}
app.auth.verification-url=${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:5000}

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}

google.client-id=${GOOGLE_CLIENT_ID}

management.endpoints.web.exposure.include=health,info

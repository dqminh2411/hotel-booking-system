spring.application.name=audit-service
server.port=${SERVER_PORT:-5000}

# MongoDB Configuration
spring.data.mongodb.host=${MONGO_HOST:-audit-db}
spring.data.mongodb.port=${MONGO_PORT:-27017}
spring.data.mongodb.database=${MONGO_DATABASE:-audit_db}
spring.data.mongodb.auto-index-creation=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:-audit-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Eureka Service Discovery
eureka.client.enabled=${EUREKA_ENABLED:-true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:-http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Keycloak / Security
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:-http://localhost:8085/realms/hotel-booking-system}
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}

# debug=true
spring.application.name=hotel-service
server.port=${SERVER_PORT:5000}

spring.datasource.url=jdbc:postgresql://${DB_HOST:hotel-db}:${DB_PORT:5432}/${DB_NAME:hotel_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.serialization.write-dates-as-timestamps=false

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.openfeign.client.config.booking-service.connectTimeout=${BOOKING_SERVICE_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.booking-service.readTimeout=${BOOKING_SERVICE_READ_TIMEOUT_MS:5000}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

spring.cache.redis.time-to-live=${REDIS_TTL:600000}

management.endpoints.web.exposure.include=health,info

minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:password123}
minio.bucket.hotel-images=${MINIO_BUCKET_HOTEL_IMAGES:hotel-images}

# KEYCLOAK (OAuth2 Resource Server)
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/hotel-booking-system}
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:hotel-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

outbox.relay.interval-ms=${OUTBOX_RELAY_INTERVAL_MS:100}
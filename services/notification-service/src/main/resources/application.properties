spring.application.name=notification-service

# SERVER
server.port=${SERVER_PORT:5000}

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_HOST:notification-db}:${DB_PORT:5432}/${DB_NAME:notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# FIREBASE
firebase.service-account-json-path=${FIREBASE_SERVICE_ACCOUNT_JSON_PATH:}

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-group}
spring.kafka.consumer.auto-offset-reset=earliest

# Key & Value deserializer
# deserialize JSON
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# serialize JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# MAIL (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# EUREKA
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}

# ACTUATOR
management.endpoints.web.exposure.include=health

# KEYCLOAK (OAuth2 Resource Server)
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/hotel-booking-system}
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/hotel-booking-system/protocol/openid-connect/certs}

# Chassis Logging Configuration
chassis.logging.enabled=true
chassis.logging.json-enabled=${CHASSIS_LOGGING_JSON_ENABLED:true}
chassis.logging.aspect-enabled=true
chassis.logging.slow-request-threshold-ms=1000
chassis.logging.exclude-paths[0]=/actuator/health
chassis.logging.exclude-paths[1]=/actuator/info
chassis.logging.exclude-paths[2]=/actuator/prometheus

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.otlp.tracing.endpoint=http://otel-collector:4318/v1/traces
otel.propagators=tracecontext,baggage

logging.level.root=INFO
logging.level.com.hotelbooking=DEBUG

# Chassis Configuration
chassis.outbox.enabled=false

